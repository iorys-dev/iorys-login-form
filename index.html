<!doctype html>
<html lang="en" data-tone="dark">
<head>
<meta charset="utf-8">
<title>iorys — Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100vh; }
  body {
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  #app { min-height: 100vh; }

  /* ─── Tone tokens ─────────────────────────────────────────── */
  :root[data-tone="light"] {
    --page-bg: #F1F2F4;
    --page-bg-2: #FAFBFC;
    --card-bg: #FFFFFF;
    --card-border: rgba(0, 32, 96, 0.08);
    --card-shadow:
      0 1px 0 rgba(0, 32, 96, 0.04),
      0 8px 24px rgba(0, 32, 96, 0.06),
      0 32px 80px rgba(0, 32, 96, 0.05);
    --text-1: #002060;
    --text-2: #6B7280;
    --text-3: #9AA3B2;
    --field-bg: #FFFFFF;
    --field-text: #002060;
    --field-placeholder: #9AA3B2;
    --field-border: #DCDFE5;
    --field-border-focus: #002060;
    --field-shadow-focus: 0 0 0 4px rgba(0, 32, 96, 0.10);
    --divider: #EDEFF2;
    --accent: #16BF99;
    --accent-press: #12997B;
    --error: #C3212C;
    --error-bg: #FEF3F2;
    --error-text: #B11A24;
    --logo-w: #002060;
  }
  :root[data-tone="dark"] {
    --page-bg: #050A1F;
    --page-bg-2: #0B132E;
    --card-bg: #1A2864;
    --card-border: rgba(82, 234, 200, 0.12);
    --card-shadow:
      0 1px 0 rgba(0,0,0,0.4),
      0 12px 32px rgba(0,0,0,0.5),
      0 32px 80px rgba(0,0,0,0.5);
    --text-1: #F5F7FA;
    --text-2: #B6C0DC;
    --text-3: #6B7796;
    --field-bg: #FDFCFE;
    --field-text: #0F1738;
    --field-placeholder: #9AA3B2;
    --field-border: rgba(255,255,255,0.10);
    --field-border-focus: #52EAC8;
    --field-shadow-focus: 0 0 0 4px rgba(82, 234, 200, 0.18);
    --divider: rgba(255,255,255,0.10);
    --accent: #16BF99;
    --accent-press: #12997B;
    --error: #F87171;
    --error-bg: rgba(248, 113, 113, 0.10);
    --error-text: #F87171;
    --logo-w: #FFFFFF;
  }

  body { background: var(--page-bg); color: var(--text-1); }

  /* ─── Page ──────────────────────────────────────────────────── */
  .iorys-page {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    overflow: hidden;
  }
  :root[data-tone="light"] .iorys-page {
    background: #E8EBF0;
  }
  :root[data-tone="dark"] .iorys-page {
    background: #060B1F;
  }

  /* ─── Gradient blob layer ─ almost-static "aurora" backdrop ── */
  .iorys-blobs {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
  }
  .iorys-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(110px);
    will-change: transform;
    transform: translate3d(0, 0, 0);
  }
  .iorys-blob--a { top: -22%; left: -18%; width: 70%; height: 70%; animation: iorys-drift-a 38s ease-in-out infinite alternate; }
  .iorys-blob--b { bottom: -25%; right: -20%; width: 80%; height: 80%; animation: iorys-drift-b 44s ease-in-out infinite alternate; }
  .iorys-blob--c { top: 30%; left: 38%; width: 55%; height: 55%; animation: iorys-drift-c 52s ease-in-out infinite alternate; }

  :root[data-tone="dark"] .iorys-blob--a { background: radial-gradient(circle, #233572 0%, transparent 65%); opacity: 0.85; }
  :root[data-tone="dark"] .iorys-blob--b { background: radial-gradient(circle, #0C2A48 0%, transparent 65%); opacity: 0.85; }
  :root[data-tone="dark"] .iorys-blob--c { background: radial-gradient(circle, #14254D 0%, transparent 65%); opacity: 0.7; }

  :root[data-tone="light"] .iorys-blob--a { background: radial-gradient(circle, rgba(0, 32, 96, 0.16) 0%, transparent 65%); }
  :root[data-tone="light"] .iorys-blob--b { background: radial-gradient(circle, rgba(90, 105, 135, 0.16) 0%, transparent 65%); }
  :root[data-tone="light"] .iorys-blob--c { background: radial-gradient(circle, rgba(0, 32, 96, 0.08) 0%, transparent 65%); }

  @keyframes iorys-drift-a {
    0%   { transform: translate3d(0, 0, 0)        scale(1); }
    100% { transform: translate3d(60px, 40px, 0)  scale(1.08); }
  }
  @keyframes iorys-drift-b {
    0%   { transform: translate3d(0, 0, 0)         scale(1); }
    100% { transform: translate3d(-50px, -40px, 0) scale(1.05); }
  }
  @keyframes iorys-drift-c {
    0%   { transform: translate3d(0, 0, 0)        scale(1); }
    100% { transform: translate3d(30px, -60px, 0) scale(1.1); }
  }
  @media (prefers-reduced-motion: reduce) {
    .iorys-blob { animation: none !important; }
  }

  /* ─── Background pattern layer ─────────────────────────────── */
  .iorys-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  /* ─── Shell ─────────────────────────────────────────────────── */
  .iorys-shell {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 416px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .iorys-brand {
    margin-bottom: 28px;
    display: inline-flex;
  }

  /* ─── Card ──────────────────────────────────────────────────── */
  .iorys-card {
    width: 100%;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 32px 30px 36px;
    box-shadow: var(--card-shadow);
  }
  .iorys-card__title {
    margin: 0 0 20px;
    font: 600 22px/28px var(--font-sans);
    letter-spacing: -0.01em;
    color: var(--text-1);
  }

  /* ─── Field ─────────────────────────────────────────────────── */
  .iorys-field-wrap {
    display: block;
    margin-bottom: 14px;
  }
  .iorys-field-wrap--nolabel { margin-bottom: 14px; }

  .iorys-field-label {
    display: block;
    font: 500 11px/16px var(--font-sans);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-2);
    margin-bottom: 7px;
    padding-left: 2px;
  }
  .iorys-pw-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .iorys-pw-head .iorys-field-label { margin-bottom: 7px; }
  .iorys-field {
    display: flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 13px;
    background: var(--field-bg);
    border: 1px solid var(--field-border);
    border-radius: 8px;
    transition: border-color .12s ease, box-shadow .12s ease;
  }
  .iorys-field.is-focus {
    border-color: var(--field-border-focus);
    box-shadow: none;
  }
  .iorys-field.is-error {
    border-color: var(--error);
    box-shadow: none;
  }
  .iorys-field input {
    flex: 1;
    height: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    font: 400 14px/20px var(--font-sans);
    color: var(--field-text);
    padding: 0;
    min-width: 0;
  }
  .iorys-field input::placeholder { color: var(--field-placeholder); opacity: 1; }
  .iorys-field input[type="password"] { letter-spacing: 0.12em; }

  .iorys-eye {
    background: transparent;
    border: 0;
    color: var(--field-placeholder);
    padding: 4px;
    margin-right: -4px;
    display: inline-flex;
    cursor: pointer;
    border-radius: 4px;
    transition: color .12s ease;
  }
  .iorys-eye:hover { color: var(--field-text); }

  /* ─── Link ──────────────────────────────────────────────────── */
  .iorys-link {
    color: var(--text-1);
    font: 500 12px/16px var(--font-sans);
    text-decoration: none;
    transition: opacity .12s ease;
  }
  .iorys-link:hover { opacity: 0.65; }
  .iorys-link--strong {
    font: 600 13px/18px var(--font-sans);
    letter-spacing: -0.005em;
  }

  /* ─── Error ─ banner + per-field hint ────────────────────── */
  .iorys-err {
    font: 400 13px/18px var(--font-sans);
    color: var(--error-text);
    background: var(--error-bg);
    border: 1px solid color-mix(in srgb, var(--error) 35%, transparent);
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  .iorys-field-err {
    font: 400 12px/16px var(--font-sans);
    color: var(--error-text);
    margin-top: 6px;
    padding-left: 2px;
  }

  /* ─── Button ────────────────────────────────────────────────── */
  .iorys-btn {
    width: 100%;
    height: 44px;
    background: var(--accent);
    color: #FFFFFF;
    border: 0;
    border-radius: 8px;
    font: 500 14px/20px var(--font-sans);
    cursor: pointer;
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    transition: background .15s ease;
    letter-spacing: -0.005em;
  }
  .iorys-btn:hover:not(:disabled) {
    background: var(--accent-press);
  }
  .iorys-btn:active:not(:disabled) {
    background: var(--accent-press);
    filter: brightness(0.94);
  }
  .iorys-btn:focus-visible {
    outline: 2px solid var(--accent-press);
    outline-offset: 2px;
  }
  .iorys-btn:disabled { cursor: not-allowed; opacity: 0.45; }
  .iorys-btn.is-loading:disabled { cursor: wait; opacity: 0.85; }

  .iorys-spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.35);
    border-top-color: #FFFFFF;
    border-radius: 50%;
    animation: iorys-spin .8s linear infinite;
  }
  @keyframes iorys-spin { to { transform: rotate(360deg); } }

  .iorys-foot {
    position: relative;
    z-index: 2;
    margin-top: 24px;
    font: 400 12px/16px var(--font-sans);
    color: var(--text-2);
    text-align: center;
  }

  /* ─── Logo color in dark ─────────────────────────────────────── */
  :root[data-tone="dark"] .iorys-brand img { filter: none; }

  /* ─── Small screens ──────────────────────────────────────────── */
  @media (max-width: 480px) {
    .iorys-page { padding: 32px 16px; }
    .iorys-card { padding: 28px 22px 24px; border-radius: 16px; }
    .iorys-brand { margin-bottom: 20px; }
    .iorys-shell { max-width: 320px; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

</body>
