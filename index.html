<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>iorys - Sign in concepts</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100vh; }
  body {
    overflow: hidden;
    background: #0A1020;
  }
  .concept-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #0A1020;
  }
  .concept-frame[hidden] {
    display: none;
  }
</style>
</head>
<body>
<iframe class="concept-frame" id="frame-v1" title="iorys login concept 1" src="Login.html?v=20260527-15"></iframe>
<iframe class="concept-frame" id="frame-v2" title="iorys login concept 2" src="Login2.html?v=20260527-15" hidden></iframe>

<script>
  const frames = {
    v1: document.getElementById("frame-v1"),
    v2: document.getElementById("frame-v2"),
  };
  let tweakState = {};

  function broadcastTweaks(edits) {
    Object.values(frames).forEach((frame) => {
      frame.contentWindow?.postMessage({ type: "sync_login_tweaks", edits }, "*");
    });
  }

  function setVersion(version, updateHash = true) {
    const next = frames[version] ? version : "v1";
    Object.entries(frames).forEach(([key, frame]) => {
      frame.hidden = key !== next;
    });
    if (updateHash) history.replaceState(null, "", "#" + next);
  }

  window.addEventListener("message", (event) => {
    if (event.data?.type === "set_login_version") {
      if (event.data.edits) {
        tweakState = { ...tweakState, ...event.data.edits };
        broadcastTweaks(event.data.edits);
      }
      setVersion(event.data.version);
    } else if (event.data?.type === "login_tweaks_changed") {
      tweakState = { ...tweakState, ...event.data.edits };
      broadcastTweaks(event.data.edits);
    }
  });

  Object.values(frames).forEach((frame) => {
    frame.addEventListener("load", () => {
      if (Object.keys(tweakState).length > 0) broadcastTweaks(tweakState);
    });
  });

  window.addEventListener("hashchange", () => {
    setVersion(location.hash.replace("#", ""), false);
  });

  setVersion(location.hash.replace("#", ""), false);
</script>
</body>
</html>
